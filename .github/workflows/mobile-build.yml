name: Build Expo mobile apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CI: true

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Android project with Expo CNG
        run: npx expo prebuild --platform android --clean --no-install

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: xinchao-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS Simulator app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate iOS project with Expo CNG
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: npx pod-install ios

      - name: Build iOS Simulator app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          test -n "$WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator app
        run: |
          APP_PATH=$(find ios/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" xinchao-ios-simulator.zip

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: xinchao-ios-simulator
          path: xinchao-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
